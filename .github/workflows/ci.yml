name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Scan quotidien : une CVE publiée après le dernier commit serait sinon
  # invisible jusqu'au prochain PR (le job `deny` relance les advisories).
  schedule:
    - cron: "0 6 * * *"

# Annule les exécutions obsolètes sur une même branche / PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Moindre privilège : la CI ne fait que lire le dépôt. Seul le job d'alerte
# (scan planifié en échec) reçoit en plus le droit d'écrire des issues.
# Les actions sont épinglées par SHA de commit (un tag est réécrivable par le
# mainteneur de l'action) ; Dependabot (github-actions) met SHA et commentaire
# de version à jour.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Toolchain Rust stable (fmt, clippy)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  deny:
    name: cargo-deny (licences + advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # L'action installe cargo-deny et lance les quatre contrôles
      # (advisories, bans, licenses, sources) selon ./deny.toml.
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
          # --all-features : couvre aussi les dépendances optionnelles (feature
          # `stream` du SDK Rust : eventsource-stream, futures-*).
          arguments: --all-features --workspace

  test:
    name: tests (avec PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        # Même version majeure que la prod (PostgreSQL 17) : un comportement
        # propre à la 17 doit casser ici, pas en production.
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: carbonfr_test
        ports:
          - 5432:5432
        # Le health-check garantit que Postgres accepte les connexions avant
        # les tests (évite les « connection reset » au démarrage).
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Active les tests d'intégration de carbonfr-adapter-postgres.
      # Les migrations sont appliquées par le test lui-même.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/carbonfr_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Tests du workspace
        # Les tests ODRÉ « live » sont #[ignore] (réseau + quota) : non exécutés.
        run: cargo test --workspace

      # `cargo test` ne compile pas les `examples/` par défaut : les couvrir
      # ici (compilation seule, pas d'exécution — certains touchent le flux
      # SSE en direct) plutôt que d'ajouter un job requis de plus (I6,
      # ADR-0031 décision 11). `--all-features` couvre la feature `stream`.
      # Les 4 exemples de `crates/sdk/examples/` (dont `stream`, qui exige la
      # feature du même nom) doivent toujours compiler.
      - name: Exemples du SDK Rust (compilation)
        run: cargo build -p carbonfr-sdk --examples --all-features

  build-release:
    name: build release (artefact déployable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # Garantit que le binaire de prod compile (profil release optimisé) et que
      # le lockfile est cohérent (`--locked`).
      - name: Build du serveur (release)
        run: cargo build --release --locked -p server --bin carbonfr-server

  sdk-typescript:
    name: SDK TypeScript (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # Plancher déclaré par le SDK (`engines.node`) : Node 22, plus ancienne
          # LTS encore maintenue (Node 20 : fin de vie le 2026-04-30).
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - name: Install (lockfile)
        run: npm ci
      - name: Typecheck + build
        run: npm run build

  # Les trois jobs suivants concernent les crates publiées/publiables sur
  # crates.io : carbonfr-core et carbonfr-eligibility (ADR-0030 §1), rejointes
  # depuis I6 par carbonfr-sdk pour les jobs MSRV et rustdoc+package
  # (ADR-0031 décision 10) — le job semver l'exclut encore, cf. son
  # commentaire plus bas. Les 9 autres membres du workspace (adapters,
  # bin/server) n'y sont pas soumis.
  msrv:
    name: MSRV (Rust 1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Plancher réel du workspace (ADR-0030 §5) : imposé par la dépendance
      # directe `time`, pas par l'édition 2024 (1.85). Toolchain épinglée en
      # dur à 1.88.0 (pas `stable`, contrairement aux autres jobs) : ce job
      # doit casser si le code se met à exiger un rustc plus récent sans
      # relever `rust-version` — relever la MSRV = bump *minor*, jamais un
      # patch (CONTRIBUTING.md), et seulement quand une dépendance directe
      # l'impose, pas par anticipation.
      - name: Toolchain Rust 1.88.0 (MSRV déclarée par le workspace)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # branche "stable" de l'action, ici épinglée à 1.88.0 via l'input toolchain
        with:
          toolchain: 1.88.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # Les trois crates publiées/publiables : la MSRV ne concerne pas les
      # adapters ni bin/server (ADR-0030 §5). `--all-features` couvre la
      # feature `stream` de carbonfr-sdk (ADR-0031 décision 9) ; sans effet
      # sur core/eligibility, qui n'ont aucune feature.
      - name: cargo check (crates publiables uniquement)
        run: cargo check --locked -p carbonfr-core -p carbonfr-eligibility -p carbonfr-sdk --all-features

  semver:
    name: semver (crates publiables)
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0 : il faut l'historique complet + les tags pour
      # retrouver le dernier tag de release (baseline ci-dessous) — un
      # checkout superficiel ne les contiendrait pas forcément.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Baselines = derniers tags de release
        id: baseline
        run: |
          echo "rev=$(git describe --tags --abbrev=0 --match 'v*' HEAD)" >> "$GITHUB_OUTPUT"
          echo "sdk=$(git describe --tags --abbrev=0 --match 'rust-sdk-v*' HEAD)" >> "$GITHUB_OUTPUT"

      # cargo-semver-checks compare l'API publique de chaque crate publiée à
      # son état au dernier tag de release — qui est aussi sa dernière version
      # publiée sur crates.io (release-crates.yml / release-rust-sdk.yml
      # publient à chaque tag). Règle ADR-0030 §3 (en 0.x, pré-1.0) : toute
      # rupture — retrait/renommage public, nouvelle variante sur un enum
      # exhaustif, nouveau champ sur une struct à champs publics, etc. — exige
      # de relever la version *minor* dans la MÊME PR, sinon CE JOB ÉCHOUE :
      # cargo-semver-checks « assume minor » tant que la version n'a pas bougé
      # (il refuse par exemple un simple ajout de `#[non_exhaustive]` sans bump).
      #
      # carbonfr-core / carbonfr-eligibility : version du workspace, tags `v*`.
      - name: cargo-semver-checks core + eligibility (baseline ${{ steps.baseline.outputs.rev }})
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        with:
          package: carbonfr-core,carbonfr-eligibility
          baseline-rev: ${{ steps.baseline.outputs.rev }}

      # carbonfr-sdk : axe de version propre (crates/sdk/Cargo.toml), tags
      # `rust-sdk-v*` (ADR-0031 décision 12) ; toutes les features, pour
      # couvrir aussi `IntensityStream` (feature `stream`).
      - name: cargo-semver-checks carbonfr-sdk (baseline ${{ steps.baseline.outputs.sdk }})
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        with:
          package: carbonfr-sdk
          feature-group: all-features
          baseline-rev: ${{ steps.baseline.outputs.sdk }}

  rustdoc-package:
    name: rustdoc + package (crates publiables)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # docs.rs ne rejette pas un avertissement rustdoc, contrairement à ce
      # job (ADR-0030 §9) : plus strict ici pour ne jamais publier de lien
      # mort. `--all-features` couvre la feature `stream` de carbonfr-sdk
      # (ADR-0031 décision 9, rejointe depuis I6) ; sans effet sur
      # core/eligibility, qui n'ont aucune feature.
      - name: rustdoc (liens morts en erreur)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --locked -p carbonfr-core -p carbonfr-eligibility -p carbonfr-sdk --all-features

      # core + eligibility dans le même appel : Cargo superpose un registre
      # local pour les membres du workspace pas encore publiés, et vérifie
      # donc `eligibility` contre la version locale de `core` (seule,
      # `cargo package -p carbonfr-eligibility` échouerait avant la publication
      # de `core`). Échoue aussi si la dépendance interne versionnée
      # (`carbonfr-core = { …, version = … }`) diverge de la version du
      # workspace. `carbonfr-sdk` n'a, lui, aucune dépendance interne
      # (ADR-0031 décision 5) : il est empaqueté dans le même appel par
      # commodité (rejoint depuis I6), pas par nécessité de vérification
      # croisée. Aucun upload, aucun jeton (ADR-0030 §8 : la 1re publication
      # est manuelle, en I5 pour core/eligibility, à venir pour le SDK).
      - name: Empaquetage (package + vérification croisée, aucun upload)
        run: cargo package --locked -p carbonfr-core -p carbonfr-eligibility -p carbonfr-sdk

  # Le scan quotidien a échoué 8 jours d'affilée (RUSTSEC-2026-0285, sept.
  # 2026) sans que personne ne le voie : un échec du run PLANIFIÉ ouvre une
  # issue (ou la commente si elle est déjà ouverte) — visible et notifiée.
  alerte-scan-planifie:
    name: Alerte (scan planifié en échec)
    needs: [lint, deny, test, build-release, sdk-typescript, msrv, semver, rustdoc-package]
    if: ${{ failure() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Ouvrir ou commenter l'issue d'alerte
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: "CI planifiée en échec sur main"
        run: |
          NUM="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
            --json number,title --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n1)"
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" \
              --body "Toujours en échec : $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$(printf '%s\n\n%s\n\n%s' \
              "Le run planifié de la CI a échoué sur \`main\` : $RUN_URL" \
              "Cause la plus fréquente : un nouvel avis RustSec (job \`cargo-deny\`) sur une dépendance, souvent transitive — que Dependabot ne met pas à jour. Correctif type : \`cargo update -p <crate>\` dans une PR." \
              "Fermer l'issue une fois \`main\` de nouveau verte.")"
          fi
