name: Publier les crates (crates.io)

# Publie carbonfr-core et carbonfr-eligibility sur crates.io quand un tag de
# release `vX.Y.Z` est poussé (ADR-0030 §8) — le même tag que l'image Docker
# (release.yml) : les deux crates portent la version du workspace (§2).
#
# Authentification = Trusted Publishing (OIDC) : AUCUN jeton stocké.
# `rust-lang/crates-io-auth-action` échange l'identité OIDC de ce workflow
# (id-token: write) contre un jeton crates.io de courte durée, révoqué par son
# post-step en fin de job.
#
# Prérequis (une fois par crate, côté crates.io, possible seulement après la
# 1re publication manuelle — faite le 2026-09-24 en 0.9.1) :
#   Page de la crate → Settings → Trusted Publishing → Add → GitHub :
#     - Repository owner  : Kovelt
#     - Repository name   : carbon-fr
#     - Workflow filename : release-crates.yml
#     - Environment       : (laisser vide)
#
# Une version publiée est immuable : en cas de problème, publier une version
# suivante ; `cargo yank` seulement dans les cas de l'ADR-0030 §8.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    name: Publier carbonfr-core + carbonfr-eligibility
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC : trusted publishing crates.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Garde-fou (identique à release.yml) : le tag doit être la version du
      # workspace, donc celle des deux crates publiées.
      - name: Vérifier que le tag == version du workspace
        run: |
          WS_VERSION="$(grep -m1 '^version' Cargo.toml | sed -E 's/^version *= *"(.*)".*/\1/')"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$WS_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME (=$TAG_VERSION) ≠ version workspace ($WS_VERSION)"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      # Répétition à blanc d'abord (ADR-0030 §8) : empaquetage + vérification
      # croisée des deux crates, sans jeton ni upload.
      - name: Répétition (cargo publish --dry-run)
        run: cargo publish --dry-run --locked -p carbonfr-core -p carbonfr-eligibility

      - name: Jeton crates.io de courte durée (OIDC)
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      # Les deux crates dans le même appel : Cargo publie dans l'ordre des
      # dépendances (core, puis eligibility une fois core disponible).
      - name: Publication
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked -p carbonfr-core -p carbonfr-eligibility
