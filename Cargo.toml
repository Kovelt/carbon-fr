[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/eligibility",
    "crates/adapter-odre",
    "crates/adapter-postgres",
    "crates/adapter-http",
    "crates/adapter-forecast",
    "crates/adapter-meteo",
    "crates/adapter-entsoe",
    "crates/adapter-webhook",
    "crates/adapter-gbdt",
    "crates/sdk",
    "bin/server",
]

# Build de production : binaire optimisé et allégé (déploiement VPS, ADR-0007).
[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[workspace.package]
# Version applicative unique du workspace (ADR-0019). Toutes les crates en
# héritent (`version.workspace = true`) ; un tag git `vX.Y.Z` doit la refléter
# et déclenche la publication de l'image Docker taguée (release.yml). Depuis
# ADR-0030 (5ᵉ axe de versionnement), c'est aussi la version crates.io de
# `carbonfr-core` et `carbonfr-eligibility` (seules crates publiées).
version = "0.9.2"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Kovelt/carbon-fr"
# Même dépôt, pas de site dédié : utilisé par les crates publiées (`core`,
# `eligibility`) comme `homepage` crates.io (ADR-0030 §7).
homepage = "https://github.com/Kovelt/carbon-fr"
# MSRV réelle du workspace (ADR-0030 §5) : plancher fixé par `time` (dépendance
# directe de `core`/`eligibility`), pas par l'édition 2024 (1.85). Un relèvement
# de MSRV est un bump *minor* (0.x), jamais patch, et seulement quand une
# dépendance directe l'impose. Hérité par `core` et `eligibility`
# (`rust-version.workspace = true`), seules crates publiées ; testé par le job
# CI « MSRV (Rust 1.88) ».
rust-version = "1.88.0"

[workspace.dependencies]
# Crates internes
# `version` requis dès qu'une autre crate publiée en dépend (ADR-0030 §2) :
# sans lui, `cargo package -p carbonfr-eligibility` échoue faute de contrainte
# de version sur cette dépendance interne. `"0.9.0"` résout par défaut en
# caret 0.x (`>=0.9.0, <0.10.0`) : à relever avec la version *minor* du
# workspace (0.10.0…). Garde-fou : le job CI « rustdoc + package » empaquette
# `eligibility` contre la version locale de `core` et échoue si les deux
# divergent.
carbonfr-core = { path = "crates/core", version = "0.9.0" }
carbonfr-eligibility = { path = "crates/eligibility" }
carbonfr-adapter-odre = { path = "crates/adapter-odre" }
carbonfr-adapter-postgres = { path = "crates/adapter-postgres" }
carbonfr-adapter-http = { path = "crates/adapter-http" }
carbonfr-adapter-meteo = { path = "crates/adapter-meteo" }
carbonfr-adapter-entsoe = { path = "crates/adapter-entsoe" }
carbonfr-adapter-webhook = { path = "crates/adapter-webhook" }
carbonfr-adapter-gbdt = { path = "crates/adapter-gbdt" }
carbonfr-adapter-forecast = { path = "crates/adapter-forecast" }

# Dépendances tierces (versions centralisées)
axum = "0.8.7"
gbdt = "0.1"
utoipa = { version = "6.0.0", features = ["axum_extras"] }
sha2 = "0.10.9"
rand = "0.10"
async-trait = "0.1.89"
anyhow = "1.0.100"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }
thiserror = "2.0.18"
time = "0.3.49"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
# reqwest 0.13 restructure son backend TLS : la feature globale « rustls-tls »
# disparaît au profit de « rustls » (qui tire `aws-lc-rs`) ou
# « rustls-no-provider » (qui ne tire AUCUN provider crypto — choisie ici, cf.
# le bloc `rustls` juste en dessous et ADR-0031 décision 3 : un seul provider
# dans le workspace, `ring`, pas de double provider avec `aws-lc-rs`). `query`
# est désormais une feature opt-in (utilisée par les adapters ODRÉ/ENTSO-E/
# météo, `.query(...)` sur `RequestBuilder`) — `form` ne l'est pas (inutilisé
# dans ce workspace). Sur Linux (seule cible de déploiement, cf. Dockerfile),
# la feature par défaut `system-proxy` ne couvre que les réglages système
# Windows/macOS ; la détection par variables d'environnement (`HTTPS_PROXY`…)
# reste, elle, toujours active — pas besoin de l'activer pour un comportement
# inchangé.
reqwest = { version = "0.13.5", default-features = false, features = [
    "json",
    "gzip",
    "query",
    "rustls-no-provider",
] }
# Dépendance directe (pas seulement transitive via reqwest) : chaque site qui
# construit un `reqwest::Client` doit pouvoir installer explicitement le
# provider crypto `ring` avant le premier `.build()` — reqwest 0.13 sans
# provider installé PANIQUE dès la construction du client, y compris pour un
# usage 100 % HTTP en clair (la pile TLS est montée à `.build()`), cf.
# `default_rustls_crypto_provider()` dans `reqwest::async_impl::client`. Même
# version que celle déjà résolue par `sqlx` (`tls-rustls-ring`, ci-dessous) :
# un seul `rustls` dans l'arbre. `default-features = false` + seule feature
# `ring` : **aucun `aws-lc-rs`** (ADR-0031 décision 3). `std` : requis par les
# types que nous manipulons (`CryptoProvider`, `Arc`) ; sans lui la crate est
# `no_std`-only.
rustls = { version = "0.23.45", default-features = false, features = [
    "ring",
    "std",
] }
tokio = { version = "1.52.3", features = ["macros", "rt"] }
tokio-stream = { version = "0.1.17", features = ["sync"] }
# Jeton d'annulation (`CancellationToken`) : arrêt gracieux borné (audit
# 2026-08) — partagé entre la composition root et les flux SSE de l'adapter
# HTTP. Licence MIT, déjà dans l'arbre (transitif sqlx/axum).
tokio-util = "0.7"
# Combinateur `take_until` (clôture des flux SSE à l'arrêt). Déjà dans l'arbre
# via axum/hyper ; sans features par défaut (calcul pur, pas d'IO).
futures-util = { version = "0.3", default-features = false }
tower-http = { version = "0.7.0", features = ["trace", "cors"] }
quick-xml = { version = "0.42.0", features = ["serialize"] }
# Analyse d'URL WHATWG (identique à celle de reqwest) — calcul pur, pas d'IO :
# utilisé par la validation anti-SSRF des webhooks pour voir exactement l'hôte
# que le client contactera (ADR-0016).
url = "2.5"
sqlx = { version = "0.8.6", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "postgres",
    "time",
    "migrate",
    "macros",
] }
