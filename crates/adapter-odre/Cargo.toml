[package]
name = "carbonfr-adapter-odre"
version.workspace = true
description = "Adapter sortant carbon-fr : implémente Eco2mixSource via l'API ODRÉ (éCO2mix RTE)."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
tracing = { workspace = true }
carbonfr-core = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
reqwest = { workspace = true }
# Installation défensive du provider crypto `ring` avant tout `reqwest::Client`
# (reqwest 0.13 sans provider panique au build) — cf. commentaire du bloc
# `rustls` dans le Cargo.toml racine.
rustls = { workspace = true }
serde = { workspace = true }
time = { workspace = true, features = ["parsing", "formatting"] }

[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
