[package]
name = "carbonfr-core"
version.workspace = true
# Anglais : audience crates.io/docs.rs internationale (ADR-0030 §7).
description = "Domain, use cases and ports for carbon-fr's carbon-intensity core — pure, IO-free Rust (hexagonal architecture)."
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/carbonfr-core"
readme = "README.md"
rust-version.workspace = true
# ≤ 5, minuscules, ≤ 20 caractères (règles crates.io, ADR-0030 §7).
keywords = ["carbon-intensity", "electricity", "energy", "emissions", "france"]
# Taxonomie crates.io : aucune catégorie « énergie » ou « climat » n'existe
# (vérifié via https://crates.io/api/v1/categories le 2026-09-23).
categories = ["science"]

[dependencies]
async-trait = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
# Calcul pur (signature HMAC des webhooks, ADR-0016) — pas d'IO.
sha2 = { workspace = true }
# Analyse d'URL WHATWG pour la validation anti-SSRF (même analyseur que reqwest,
# ADR-0016) — calcul pur, pas d'IO (au même titre que sha2).
url = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
