# Politique de chaîne d'approvisionnement (cargo-deny).
#
# Projet souverain et open source (double licence MIT / Apache-2.0) : on veille
# à ne tirer que des dépendances à licence permissive compatible, sans CVE
# connue, et issues de sources de confiance. Vérifié en CI à chaque PR.
#
# Lancer localement : `cargo deny check`

# ─── Avis de sécurité (RustSec) ────────────────────────────────────────────
[advisories]
# Base d'avis par défaut (https://github.com/RustSec/advisory-db).
# Les vulnérabilités et codes « unsound » échouent ; les caisses non
# maintenues du graphe de l'espace de travail aussi. Un crate « yanké »
# (retiré de crates.io) fait échouer le contrôle.
yanked = "deny"
# Crates non maintenues : refusées sur TOUT le graphe (défaut de cargo-deny
# ≥ 0.16, rendu explicite ici pour que le commentaire ci-dessus fasse foi).
unmaintained = "all"
# Avis à ignorer ponctuellement (id RustSec + justification). Vide par défaut.
ignore = []

# ─── Licences ──────────────────────────────────────────────────────────────
[licenses]
# Liste blanche fermée : toute licence absente d'ici fait échouer le contrôle.
# Calée sur l'arbre réel (`cargo deny list`) — toutes permissives, aucune
# copyleft. Toute nouvelle dépendance à licence inédite force une décision
# explicite (ajout ici, avec le recul que ça mérite).
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
# Seuil de confiance de la détection de licence (0.8 = défaut prudent).
confidence-threshold = 0.8

# ─── Bans / doublons ───────────────────────────────────────────────────────
[bans]
# Plusieurs versions d'une même caisse = avertissement, pas erreur : c'est
# courant et hors de notre contrôle dans l'arbre transitif. On le voit sans
# bloquer la CI. Origine des doublons connus (relevé du 2026-09-24, après la
# montée reqwest 0.12 → 0.13, plan I5 — `cargo tree -i <crate>@<version>`)
# — plutôt que des `skip` qui deviendraient faux aux prochaines migrations :
#   - `tower-http` 0.6 / 0.7      ← NE disparaît PAS avec reqwest 0.13, contrairement à ce que
#                                    prévoyait ce commentaire avant le 2026-09-24 : reqwest épingle
#                                    lui-même `tower-http = "0.6.8"` en dépendance directe (features
#                                    `decompression-gzip`/`follow-redirect`, cf. son Cargo.toml), sur
#                                    ses DEUX branches majeures 0.12 et 0.13 — c'est `carbonfr-adapter-http`
#                                    qui veut du 0.7 (cors + trace). Ne se résorbera qu'à une future
#                                    montée de reqwest qui relève sa propre borne (hors de notre main).
#   - `base64` 0.22 / 0.23        ← NOUVEAU depuis reqwest 0.13 (`base64 = "0.23"` dans son
#                                    Cargo.toml, contre 0.22 tiré par `hyper-util`) — même nature que
#                                    `tower-http` ci-dessus, pas d'action possible côté carbon-fr.
#   - `hashbrown` 0.15/0.17       ← sqlx 0.8 (via `hashlink`) et `indexmap` (sqlx + utoipa) →
#                                    devrait converger avec sqlx 0.9 (plan I7). `webpki-roots` n'est
#                                    plus dans cette liste : jamais recompté en doublon par cargo-deny
#                                    (0.26.11 dépend lui-même en interne de 1.0.7, une seule entrée
#                                    « active » pour notre usage) — sqlx est aujourd'hui la SEULE
#                                    source de `webpki-roots` dans l'arbre (`cargo tree -i webpki-roots@0.26.11`) ;
#                                    reqwest 0.13 ne le tire plus du tout (vérifie via `rustls-platform-verifier`
#                                    → magasin système, cf. Dockerfile).
#   - `rand`/`rand_core`/`getrandom` 0.8/0.6/0.2 ← gbdt 0.1 et sqlx-postgres 0.8
#   - `syn` 2 et 3                ← macros procédurales tierces (transition de l'écosystème)
#   - `cpufeatures`, `windows-*`, `redox_syscall` ← dépendances de plateforme (non compilées sous Linux)
# Un NOUVEAU doublon hors de cette liste mérite un coup d'œil (`cargo tree -d`).
multiple-versions = "warn"
# Caisses dont l'usage est explicitement interdit (vide par défaut).
deny = []

# ─── Sources ───────────────────────────────────────────────────────────────
[sources]
# Seules crates.io et les registres/sources git explicitement listés sont
# admis : empêche l'introduction silencieuse d'une dépendance hors registre.
unknown-registry = "deny"
unknown-git = "deny"
