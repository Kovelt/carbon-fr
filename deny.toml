# Politique de chaîne d'approvisionnement (cargo-deny).
#
# Projet souverain et open source (double licence MIT / Apache-2.0) : on veille
# à ne tirer que des dépendances à licence permissive compatible, sans CVE
# connue, et issues de sources de confiance. Vérifié en CI à chaque PR.
#
# Lancer localement : `cargo deny check`

# ─── Avis de sécurité (RustSec) ────────────────────────────────────────────
[advisories]
# Base d'avis par défaut (https://github.com/RustSec/advisory-db).
# Les vulnérabilités et codes « unsound » échouent ; les caisses non
# maintenues du graphe de l'espace de travail aussi. Un crate « yanké »
# (retiré de crates.io) fait échouer le contrôle.
yanked = "deny"
# Crates non maintenues : refusées sur TOUT le graphe (défaut de cargo-deny
# ≥ 0.16, rendu explicite ici pour que le commentaire ci-dessus fasse foi).
unmaintained = "all"
# Avis à ignorer ponctuellement (id RustSec + justification). Vide par défaut.
ignore = []

# ─── Licences ──────────────────────────────────────────────────────────────
[licenses]
# Liste blanche fermée : toute licence absente d'ici fait échouer le contrôle.
# Calée sur l'arbre réel (`cargo deny list`) — toutes permissives, aucune
# copyleft. Toute nouvelle dépendance à licence inédite force une décision
# explicite (ajout ici, avec le recul que ça mérite).
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
# Seuil de confiance de la détection de licence (0.8 = défaut prudent).
confidence-threshold = 0.8

# ─── Bans / doublons ───────────────────────────────────────────────────────
[bans]
# Plusieurs versions d'une même caisse = avertissement, pas erreur : c'est
# courant et hors de notre contrôle dans l'arbre transitif. On le voit sans
# bloquer la CI. Origine des doublons connus (relevé du 2026-09-24, après la
# montée reqwest 0.12 → 0.13, plan I5 — `cargo tree -i <crate>@<version>`)
# — plutôt que des `skip` qui deviendraient faux aux prochaines migrations :
#   - `tower-http` 0.6 / 0.7      ← NE disparaît PAS avec reqwest 0.13, contrairement à ce que
#                                    prévoyait ce commentaire avant le 2026-09-24 : reqwest épingle
#                                    lui-même `tower-http = "0.6.8"` en dépendance directe (features
#                                    `decompression-gzip`/`follow-redirect`, cf. son Cargo.toml), sur
#                                    ses DEUX branches majeures 0.12 et 0.13 — c'est `carbonfr-adapter-http`
#                                    qui veut du 0.7 (cors + trace). Ne se résorbera qu'à une future
#                                    montée de reqwest qui relève sa propre borne (hors de notre main).
#   - `base64` 0.22 / 0.23        ← NOUVEAU depuis reqwest 0.13 (`base64 = "0.23"` dans son
#                                    Cargo.toml, contre 0.22 tiré par `hyper-util`) — même nature que
#                                    `tower-http` ci-dessus, pas d'action possible côté carbon-fr.
#   - `hashbrown` 0.16/0.17       ← RE-VÉRIFIÉ le 2026-09-25 après la montée sqlx 0.8 → 0.9 (plan
#                                    I7, `cargo tree -d` + `cargo tree -i hashbrown@<version>`) :
#                                    NE CONVERGE PAS, contrairement à ce que prévoyait ce commentaire
#                                    avant le 2026-09-25 — `hashlink` (0.9 → 0.11, tiré par
#                                    `sqlx-core`) a juste bougé de `hashbrown` 0.15 à **0.16**, tandis
#                                    qu'`indexmap` (sqlx + utoipa) reste sur 0.17 : toujours 2 lignes
#                                    majeures distinctes, sans action possible côté carbon-fr.
#                                    `webpki-roots` n'est toujours pas dans cette liste (single
#                                    version, jamais recompté en doublon par cargo-deny) : sqlx 0.9 a
#                                    lui-même relevé sa propre dépendance transitive de 0.26.11 à
#                                    **1.0.7** (vérifié `cargo tree -i webpki-roots@1.0.7`, 2026-09-25)
#                                    — sqlx reste la SEULE source dans l'arbre ; reqwest 0.13 ne le
#                                    tire toujours pas (`rustls-platform-verifier` → magasin système,
#                                    cf. Dockerfile).
#   - `rand`/`rand_core`/`getrandom` 0.8/0.6/0.2 ← RÉDUIT (pas éliminé) par la montée sqlx 0.9 :
#                                    vérifié le 2026-09-25 (`cargo tree -i rand@10.3.0`), `sqlx-postgres`
#                                    0.9 résout désormais `rand` **0.10.3** — convergé avec notre propre
#                                    `rand = "0.10"` (workspace) et `carbonfr-adapter-http` — alors qu'en
#                                    0.8 il tirait encore du 0.8 comme `gbdt`. Seul `gbdt` 0.1 (modèle
#                                    NON SERVI, ADR-0012) reste sur la ligne 0.8/0.6/0.2 : sqlx est sorti
#                                    de la liste des causes.
#   - `sha2`/`digest`/`crypto-common`/`block-buffer` ← NOUVEAU depuis sqlx 0.9 (vérifié le 2026-09-25,
#                                    `cargo tree -i digest@0.11.3`) : l'authentification SCRAM-SHA-256
#                                    de `sqlx-postgres` 0.9 passe désormais par `hmac` 0.13 → `hkdf`
#                                    0.13 / `md-5` 0.11 / `sha2` **0.11**, qui tirent la génération
#                                    RustCrypto « 0.11 » (`digest` 0.11, `block-buffer` 0.12,
#                                    `crypto-common` 0.2) — distincte de notre propre dépendance
#                                    `sha2 = "0.10.9"` (workspace, `carbonfr-core` : signature HMAC des
#                                    webhooks ADR-0016 ; aussi `carbonfr-adapter-http`), restée sur la
#                                    génération « 0.10 ». Choix interne de sqlx, aucune action possible
#                                    côté carbon-fr.
#   - `base64` 0.22 / 0.23        ← toujours 2 versions (reqwest épingle `"0.23"` en direct, contre
#                                    0.22 tiré par `hyper-util`), même nature que `tower-http`
#                                    ci-dessous, pas d'action possible côté carbon-fr. Constat du
#                                    2026-09-25 : `sqlx-core` 0.9 est désormais AUSSI une source de
#                                    `base64` (même version 0.22.1 qu'`hyper-util` — ne crée pas de
#                                    3ᵉ version, `cargo tree -i base64@0.22.1`).
#   - `tower-http` 0.6 / 0.7      ← inchangé par la montée sqlx (montée reqwest 0.12 → 0.13, plan I5) :
#                                    reqwest épingle lui-même `tower-http = "0.6.8"` en dépendance
#                                    directe (features `decompression-gzip`/`follow-redirect`, cf. son
#                                    Cargo.toml), sur ses DEUX branches majeures 0.12 et 0.13 — c'est
#                                    `carbonfr-adapter-http` qui veut du 0.7 (cors + trace). Ne se
#                                    résorbera qu'à une future montée de reqwest qui relève sa propre
#                                    borne (hors de notre main).
#   - `syn` 2 et 3                ← macros procédurales tierces (transition de l'écosystème)
#   - `cpufeatures`, `windows-*`, `redox_syscall` ← dépendances de plateforme (non compilées sous Linux)
# Un NOUVEAU doublon hors de cette liste mérite un coup d'œil (`cargo tree -d`).
multiple-versions = "warn"
# Caisses dont l'usage est explicitement interdit (vide par défaut).
deny = []

# ─── Sources ───────────────────────────────────────────────────────────────
[sources]
# Seules crates.io et les registres/sources git explicitement listés sont
# admis : empêche l'introduction silencieuse d'une dépendance hors registre.
unknown-registry = "deny"
unknown-git = "deny"
