# Règles d'alerte carbon-fr (ADR-0022) — référence versionnée, identique aux
# règles de l'instance Kovelt. À charger via `rule_files` (cf. deploy/README.md
# §3). ⚠️ Des règles SANS routage de notification (Alertmanager, ou un
# superviseur externe) ne préviennent personne : elles ne sont visibles que
# dans l'onglet Alerts de l'UI Prometheus.
groups:
  - name: carbon-fr
    rules:
      # Le scrape échoue (conteneur down, réseau, /metrics injoignable).
      - alert: CarbonfrDown
        expr: up{job="carbon-fr"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "carbon-fr injoignable au scrape (/metrics)"
          description: "Aucune réponse de carbon-fr:8080/metrics depuis 5 min."

      # Alerte phare (ADR-0022) : ingestion gelée. Poller par défaut = 900 s ;
      # on alerte si aucun cycle réussi depuis > 2× l'intervalle (1800 s).
      - alert: CarbonfrIngestionStale
        expr: time() - carbonfr_poller_last_success_timestamp_seconds > 1800
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Ingestion carbon-fr gelée (donnée RTE non rafraîchie)"
          description: "Aucun cycle de poll réussi depuis plus de 30 min — l'API sert de la donnée potentiellement obsolète."

      # Erreurs d'ingestion qui s'accumulent (régions en échec répété).
      - alert: CarbonfrIngestionErrors
        expr: increase(carbonfr_poller_ingest_errors_total[15m]) > 10
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Erreurs d'ingestion carbon-fr fréquentes"
          description: "Plus de 10 échecs d'ingestion sur les 15 dernières minutes."

      # Donnée figée : la dernière mesure nationale connue vieillit alors que le
      # poller peut « réussir » (même point réécrit) ou échouer en boucle (source
      # ODRÉ en panne). ODRÉ publie avec ~30 min de retard → alerte au-delà de 2 h.
      # Panne du 2026-08-25 au 2026-09-03 : donnée âgée de 207 h, sans que
      # personne ne soit prévenu (aucun routage de notification).
      - alert: CarbonfrDataStale
        expr: time() - carbonfr_poller_last_measurement_timestamp_seconds > 7200
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Donnée carbon-fr figée (dernière mesure nationale de plus de 2 h)"
          description: "La source ODRÉ ne publie plus, ou la collecte ne récupère plus rien de neuf : l'API sert une donnée de plus de 2 h."

      # Quota ODRÉ réel (ADR-0022 addendum 2026-09-26, PROD-3) : par jeu de
      # données, lu sur les en-têtes ODRÉ (pas un proxy). Prérequis du
      # comblement régional (PROD-1/PERF-3) : visibilité avant de densifier le
      # poll sur `eco2mix-regional-tr`.
      - alert: CarbonfrOdreQuotaLow
        expr: carbonfr_odre_quota_remaining / carbonfr_odre_quota_limit < 0.10
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Quota ODRÉ bas pour le jeu {{ $labels.dataset }}"
          description: "Moins de 10 % du quota mensuel restant sur {{ $labels.dataset }} depuis plus de 30 min — surveiller la fréquence de poll avant épuisement."

      - alert: CarbonfrOdreQuotaExhausted
        expr: carbonfr_odre_quota_remaining == 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Quota ODRÉ épuisé pour le jeu {{ $labels.dataset }}"
          description: "Le quota mensuel ODRÉ (par jeu et par IP) est à 0 sur {{ $labels.dataset }} depuis plus de 15 min — la collecte de ce jeu échouera jusqu'à la remise à zéro (carbonfr_odre_quota_reset_timestamp_seconds)."
